name: Selected local contracts

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Standard hosted macOS VMs are private to each job.
# Owner-approved macOS exception: pinned setup precedes offline tests.
env:
  BATZ_DIFF_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

defaults:
  run:
    shell: bash

jobs:
  select:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      fast: ${{ steps.jobs.outputs.fast }}
      app: ${{ steps.jobs.outputs.app }}
      models: ${{ steps.jobs.outputs.models }}
      adapters: ${{ steps.jobs.outputs.adapters }}
      docs: ${{ steps.jobs.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: 'false'
      - id: jobs
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          ci/select "$BASE" HEAD > "$RUNNER_TEMP/batz-selection.json"
          "$BATZ_TOOLCHAIN_ROOT/venv/bin/python" -I -B - <<'PY'
          import json, os
          from pathlib import Path
          selected = json.loads((Path(os.environ["RUNNER_TEMP"]) / "batz-selection.json").read_text())
          print(json.dumps(selected, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name in ("fast", "app", "models", "adapters", "docs"):
                  output.write(name + "=" + json.dumps(selected[name]) + "\n")
          PY

  fast:
    needs: select
    if: needs.select.outputs.fast == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: ./.github/actions/prepare-macos
      - run: ci/test fast

  shared-runtime:
    needs: select
    if: needs.select.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: ./.github/actions/prepare-macos
      - run: ci/test app

  models:
    needs: select
    if: needs.select.outputs.models != '[]'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: ./.github/actions/prepare-macos
        with:
          build-cache: 'false'
      - env:
          PIPELINES: ${{ needs.select.outputs.models }}
        run: |
          "$BATZ_TOOLCHAIN_ROOT/venv/bin/python" -I -B - <<'PYCODE'
          import json, os, subprocess
          subprocess.run(['ci/test', 'models', '--mode', 'native', *json.loads(os.environ['PIPELINES'])], check=True)
          PYCODE

  adapters:
    needs: select
    if: needs.select.outputs.adapters != '[]'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJSON(needs.select.outputs.adapters) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: ./.github/actions/prepare-macos
      - env:
          PIPELINE: ${{ matrix.pipeline }}
        run: ci/test models "$PIPELINE" --mode adapters

  docs:
    needs: select
    if: needs.select.outputs.docs == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: git diff --check "$(git merge-base "$BASE" HEAD)" HEAD

  # Require this check after hosted-run evidence is accepted.
  gate:
    needs: [select, fast, shared-runtime, models, adapters, docs]
    if: always()
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Require successful selection and selected checks
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$SELECT_RESULT" = success
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac

apiVersion: batz/v0alpha2
kind: SourcePipeline
name: synthetic-jsonl
version: 1
normalization:
  project: repo://.
  staging: probe.records
  evidence: probe.evaluation
  checks: probe.required_checks
routes:
  local_raw:
    input:
      engine: bento
      framing: jsonl
      config: repo://internal/app/testdata/synthetic/collector.yaml
      params:
        path: {type: path, required: true, env: BATZ_SOURCE_PATH}
    output:
      parsed: {format: parquet}
      normalized:
        models:
          findings: probe.findings
explain:
  examples:
    - id: events
      route: local_raw
      input: repo://internal/app/testdata/synthetic/events.jsonl
      sha256: c3f364dcc3a4dfc28c5c675e4ef6635b312ae988e1bf30d5d1639bb4573f566b
      expectations: repo://internal/app/testdata/synthetic/events.expected.json

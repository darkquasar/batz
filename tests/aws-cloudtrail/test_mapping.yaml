test_duplicate_combination_retains_origins_and_flags_all_conflicting_variants:
  model: cloudtrail.api_activity
  inputs:
    cloudtrail.source_staging:
      columns:
        observation_id: VARCHAR
        mapping_status: VARCHAR
        payload: VARCHAR
        caller: VARCHAR
        occurrence_time: TIMESTAMP_NS
        original_time: VARCHAR
        original_offset: VARCHAR
        fraction_digits: INTEGER
        parsed_revision: VARCHAR
        parsed_file: VARCHAR
        parsed_row: BIGINT
        batz: STRUCT(source_event_id VARCHAR, logical_event_id VARCHAR, norm_event_variant_id VARCHAR)
      query: |
        SELECT id AS observation_id, 'mapped' AS mapping_status, payload,
          NULL::VARCHAR AS caller, NULL::TIMESTAMP_NS AS occurrence_time,
          NULL::VARCHAR AS original_time, NULL::VARCHAR AS original_offset,
          NULL::INTEGER AS fraction_digits, 'revision' AS parsed_revision,
          'file' AS parsed_file, ordinal::BIGINT AS parsed_row,
          {'source_event_id':id,'logical_event_id':logical_id,
            'norm_event_variant_id':variant} AS batz
        FROM (VALUES
          ('a','logical','same','{"eventID":"event"}',0),
          ('b','logical','same','{"eventID":"event"}',1),
          ('c','logical','changed','{"eventID":"event","extra":"changed"}',2),
          ('d','logical','changed','{"eventID":"event","extra":"changed"}',3)
        ) t(id,logical_id,variant,payload,ordinal)
    batz_input.build_context:
      rows:
        - {input_revision: revision, input_digest: digest, attempt_id: attempt, evaluation_nonce: nonce}
  outputs:
    query:
      partial: true
      query: |
        SELECT {'source_event_id':source_id, 'logical_event_id':logical_id,
          'norm_event_variant_id':variant, 'conflict':conflict,
          'actor_account_id':NULL::VARCHAR,
          'target':{'bucket':NULL::VARCHAR,'key':NULL::VARCHAR},
          'time':{'original':NULL::VARCHAR,'fraction_digits':NULL::INTEGER,
                  'offset':NULL::VARCHAR,'uncertainty':'unspecified'},
          'profile':'batz-investigation/v0alpha1', 'origins':origins,
          'source_payload':payload, 'input_revision':'revision','input_digest':'digest',
          'attempt_id':'attempt','evaluation_nonce':'nonce'} AS batz
        FROM (VALUES
          (NULL::VARCHAR,'logical','same',true,[{'source_event_id':'a','parsed_revision':'revision','file':'file','row':0::BIGINT},{'source_event_id':'b','parsed_revision':'revision','file':'file','row':1::BIGINT}],'{"eventID":"event"}'),
          (NULL::VARCHAR,'logical','changed',true,[{'source_event_id':'c','parsed_revision':'revision','file':'file','row':2::BIGINT},{'source_event_id':'d','parsed_revision':'revision','file':'file','row':3::BIGINT}],'{"eventID":"event","extra":"changed"}')
        ) t(source_id,logical_id,variant,conflict,origins,payload)

test_unidentified_observations_keep_separate_origins_without_conflicts:
  model: cloudtrail.api_activity
  inputs:
    cloudtrail.source_staging:
      columns:
        observation_id: VARCHAR
        mapping_status: VARCHAR
        payload: VARCHAR
        caller: VARCHAR
        occurrence_time: TIMESTAMP_NS
        original_time: VARCHAR
        original_offset: VARCHAR
        fraction_digits: INTEGER
        parsed_revision: VARCHAR
        parsed_file: VARCHAR
        parsed_row: BIGINT
        batz: STRUCT(source_event_id VARCHAR, logical_event_id VARCHAR, norm_event_variant_id VARCHAR)
      query: |
        SELECT id AS observation_id, 'mapped' AS mapping_status, payload,
          NULL::VARCHAR AS caller,
          make_timestamp_ns(1792929600000000000 + CASE WHEN id='u1' THEN 1 ELSE 2 END) AS occurrence_time,
          CASE WHEN id='u1' THEN '2026-10-25T12:00:00.000000001Z' ELSE '2026-10-25T22:00:00.000000002+10:00' END AS original_time,
          CASE WHEN id='u1' THEN 'Z' ELSE '+10:00' END AS original_offset,
          9::INTEGER AS fraction_digits, 'revision' AS parsed_revision,
          'file' AS parsed_file, ordinal::BIGINT AS parsed_row,
          {'source_event_id':id,'logical_event_id':logical_id,
            'norm_event_variant_id':variant} AS batz
        FROM (VALUES
          ('u1',NULL::VARCHAR,'u1','{"extra":"same-unidentified"}',0),
          ('u2',NULL::VARCHAR,'u2','{"extra":"same-unidentified"}',1)
        ) t(id,logical_id,variant,payload,ordinal)
    batz_input.build_context:
      rows:
        - {input_revision: revision, input_digest: digest, attempt_id: attempt, evaluation_nonce: nonce}
  outputs:
    query:
      partial: true
      query: |
        SELECT make_timestamp_ns(1792929600000000000 + CASE WHEN source_id='u1' THEN 1 ELSE 2 END) AS "@timestamp",
          {'source_event_id':source_id, 'logical_event_id':logical_id,
          'norm_event_variant_id':variant, 'conflict':conflict,
          'actor_account_id':NULL::VARCHAR,
          'target':{'bucket':NULL::VARCHAR,'key':NULL::VARCHAR},
          'time':{'original':CASE WHEN source_id='u1' THEN '2026-10-25T12:00:00.000000001Z' ELSE '2026-10-25T22:00:00.000000002+10:00' END,
                  'fraction_digits':9::INTEGER,
                  'offset':CASE WHEN source_id='u1' THEN 'Z' ELSE '+10:00' END,'uncertainty':'unspecified'},
          'profile':'batz-investigation/v0alpha1', 'origins':origins,
          'source_payload':payload, 'input_revision':'revision','input_digest':'digest',
          'attempt_id':'attempt','evaluation_nonce':'nonce'} AS batz
        FROM (VALUES
          ('u1',NULL::VARCHAR,'u1',false,[{'source_event_id':'u1','parsed_revision':'revision','file':'file','row':0::BIGINT}],'{"extra":"same-unidentified"}'),
          ('u2',NULL::VARCHAR,'u2',false,[{'source_event_id':'u2','parsed_revision':'revision','file':'file','row':1::BIGINT}],'{"extra":"same-unidentified"}')
        ) t(source_id,logical_id,variant,conflict,origins,payload)

test_required_995_valid_5_mapping_rejects:
  model: cloudtrail.source_staging
  inputs:
    batz_input.parsed:
      query: |
        SELECT 'fixture' AS binding_id, 'row-' || i AS observation_id,
          json_object('eventSource','s3.amazonaws.com','eventName','GetObject',
           'eventType','AwsApiCall','userIdentity',json_object('type','IAMUser'),
           'eventID', to_json('id-' || i),'sourceIPAddress',CASE WHEN i<995 THEN to_json('192.0.2.1') ELSE '42'::JSON END)::VARCHAR AS payload
        FROM range(1000) r(i)
  outputs:
    query:
      partial: true
      query: |
        SELECT 'row-' || i AS observation_id,
          CASE WHEN i<995 THEN 'mapped' ELSE 'rejected' END AS mapping_status
        FROM range(1000) r(i)
test_required_80_mapped_20_unsupported:
  model: cloudtrail.source_staging
  inputs:
    batz_input.parsed:
      query: |
        SELECT 'fixture' AS binding_id, 'row-' || i AS observation_id,
          json_object('eventSource','s3.amazonaws.com','eventName',CASE WHEN i<80 THEN 'GetObject' ELSE 'Unknown' END,
           'eventType','AwsApiCall','userIdentity',json_object('type','IAMUser'))::VARCHAR AS payload
        FROM range(100) r(i)
  outputs:
    query:
      partial: true
      query: |
        SELECT 'row-' || i AS observation_id,
          CASE WHEN i<80 THEN 'mapped' ELSE 'unsupported' END AS mapping_status
        FROM range(100) r(i)
test_time_classification_and_offset:
  model: cloudtrail.source_staging
  inputs:
    batz_input.parsed:
      rows:
        - observation_id: offset
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-10-25T14:00:00+02:00"}'
        - observation_id: nano_z
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-10-25T12:00:00.000000001Z"}'
        - observation_id: nano_offset
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-10-25T22:00:00.000000002+10:00"}'
        - observation_id: coarse
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-10-25T12:00:00.123Z"}'
        - observation_id: undated
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"}}'
        - observation_id: malformed
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-99-25T12:00:00Z"}'
        - observation_id: too_precise
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"2026-10-25T12:00:00.1234567891Z"}'
        - observation_id: out_of_range
          binding_id: fixture
          payload: '{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"},"eventTime":"1500-01-01T00:00:00Z"}'
  outputs:
    query:
      partial: true
      rows:
        - {observation_id: offset, mapping_status: mapped, original_offset: '+02:00', occurrence_time: '2026-10-25 12:00:00', fraction_digits: 0}
        - {observation_id: nano_z, mapping_status: mapped, original_offset: Z, occurrence_time: '2026-10-25 12:00:00.000000001', fraction_digits: 9}
        - {observation_id: nano_offset, mapping_status: mapped, original_offset: '+10:00', occurrence_time: '2026-10-25 12:00:00.000000002', fraction_digits: 9}
        - {observation_id: coarse, mapping_status: mapped, original_offset: Z, occurrence_time: '2026-10-25 12:00:00.123', fraction_digits: 3}
        - {observation_id: undated, mapping_status: mapped, original_offset: null, occurrence_time: null, fraction_digits: null}
        - {observation_id: malformed, mapping_status: rejected, original_offset: Z, occurrence_time: null, fraction_digits: 0}
        - {observation_id: too_precise, mapping_status: unavailable, original_offset: Z, occurrence_time: null, fraction_digits: 10}
        - {observation_id: out_of_range, mapping_status: unavailable, original_offset: Z, occurrence_time: null, fraction_digits: 0}

test_semantic_oracle_rejects_wrong_action_actor_time_and_outcome:
  model: cloudtrail.required_checks
  inputs:
    cloudtrail.api_activity:
      columns:
        event: STRUCT(action VARCHAR,kind VARCHAR,outcome VARCHAR)
        ecs: STRUCT(version VARCHAR)
        user: STRUCT(id VARCHAR)
        '"@timestamp"': TIMESTAMP_NS
        batz: STRUCT(origins STRUCT(source_event_id VARCHAR)[],time STRUCT(original VARCHAR,fraction_digits INTEGER))
      query: |
        SELECT {'action':action,'kind':'event','outcome':outcome} AS event,
         {'version':'9.5.0'} AS ecs, {'id':actor} AS "user",
         make_timestamp_ns(1792929600000000000+shift_ns) AS "@timestamp",
         {'origins':[{'source_event_id':id}], 'time':{'original':'2026-10-25T12:00:00Z','fraction_digits':0}} AS batz
        FROM (VALUES
         ('action','wrong','reviewed-actor',0,'success'),
         ('actor','object-read','wrong-actor',0,'success'),
         ('time','object-read','reviewed-actor',1,'success'),
         ('outcome','object-read','reviewed-actor',0,'failure')) t(id,action,actor,shift_ns,outcome)
    cloudtrail.source_staging:
      columns: {observation_id: VARCHAR, payload: VARCHAR, occurrence_time: TIMESTAMP_NS, original_time: VARCHAR, fraction_digits: INTEGER, mapping_status: VARCHAR}
      query: |
        SELECT id AS observation_id,
         '{"userIdentity":{"arn":"reviewed-actor"}}' AS payload,
         TIMESTAMP_NS '2026-10-25 12:00:00' AS occurrence_time,
         '2026-10-25T12:00:00Z' AS original_time,0::INTEGER AS fraction_digits,
         'mapped' AS mapping_status
        FROM (VALUES ('action'),('actor'),('time'),('outcome')) t(id)
  outputs:
    query:
      rows:
        - {assertion_failures: 4, capability_failures: 0}


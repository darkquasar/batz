test_each_malformed_supported_field_is_rejected:
  model: cloudtrail.source_staging
  inputs:
    batz_input.parsed:
      query: |
        SELECT 'fixture' AS binding_id, field AS observation_id,
         json_merge_patch('{"eventSource":"s3.amazonaws.com","eventName":"GetObject","eventType":"AwsApiCall","userIdentity":{"type":"IAMUser"}}'::JSON, bad::JSON)::VARCHAR AS payload
        FROM (VALUES
         ('eventID','{"eventID":42}'),
         ('awsRegion','{"awsRegion":42}'),
         ('accountId','{"userIdentity":{"accountId":{"bad":true}}}'),
         ('sourceIPAddress','{"sourceIPAddress":42}'),
         ('errorCode','{"errorCode":42}')) t(field,bad)
  outputs:
    query:
      partial: true
      rows:
        - {observation_id: eventID, mapping_status: mapped, mapping_reject_reason: null}
        - {observation_id: awsRegion, mapping_status: rejected, mapping_reject_reason: invalid-supported-field}
        - {observation_id: accountId, mapping_status: rejected, mapping_reject_reason: invalid-supported-field}
        - {observation_id: sourceIPAddress, mapping_status: rejected, mapping_reject_reason: invalid-supported-field}
        - {observation_id: errorCode, mapping_status: rejected, mapping_reject_reason: invalid-supported-field}

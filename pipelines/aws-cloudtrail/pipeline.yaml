apiVersion: batz/v0alpha2
kind: SourcePipeline
name: aws-cloudtrail
version: 1
normalization:
  project: repo://.
  staging: cloudtrail.source_staging
  evidence: cloudtrail.build_evidence
  checks: cloudtrail.required_checks
routes:
  local_raw:
    input:
      engine: bento
      framing: records-json
      config: repo://pipelines/aws-cloudtrail/input/local-records.yaml
      params:
        path: {type: path, required: true, env: BATZ_SOURCE_PATH}
    output:
      parsed: {format: parquet}
      normalized:
        models:
          api_activity: cloudtrail.api_activity
explain:
  examples:
    - id: wiring
      route: local_raw
      input: repo://pipelines/aws-cloudtrail/fixtures/wiring.json
      sha256: 6bc2b0ba730c37e754662425b5d5982743f8fca2aa8a9610390bedf04878ce10
      expectations: repo://pipelines/aws-cloudtrail/fixtures/wiring.expected.json
    - id: api-read
      route: local_raw
      input: repo://pipelines/aws-cloudtrail/fixtures/api-read.json
      sha256: 72f8117ea2033e4b391f12ed1948d681f88a6a0310c46e07dce4aa9d53c1e8c9
      expectations: repo://pipelines/aws-cloudtrail/fixtures/api-read.expected.json
